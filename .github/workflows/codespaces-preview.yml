name: Codespaces preview
on:
  pull_request:
    paths:
      - '.devcontainer/**'
      - '.github/workflows/codespaces-preview.yml'
      - 'react-configurator/**'
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - '.github/workflows/codespaces-preview.yml'
      - 'react-configurator/**'
permissions:
  contents: read
concurrency:
  group: codespaces-preview-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: react-configurator/package-lock.json
      - name: Check configuration and shell syntax
        run: |
          node --test .devcontainer/config.test.mjs
          bash -n .devcontainer/start-preview.sh
      - name: Install locked dependencies and run tests/build
        working-directory: react-configurator
        run: |
          npm ci
          npm run check
          npx playwright install --with-deps chromium
      - name: Start the preview twice (idempotence)
        run: |
          bash .devcontainer/start-preview.sh
          cp .devcontainer/.runtime/preview.pid /tmp/preview-original.pid
          bash .devcontainer/start-preview.sh
          cmp /tmp/preview-original.pid .devcontainer/.runtime/preview.pid
      - name: Chromium homepage smoke test
        run: node .devcontainer/smoke.cjs
      - name: Existing browser checks through the preview server
        working-directory: react-configurator
        env:
          KITCHEN_APP_URL: http://127.0.0.1:5173
        run: |
          npm run test:browser
          npm run test:persistence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: codespaces-preview-verification
          include-hidden-files: true
          path: |
            .devcontainer/.runtime/preview.log
            .devcontainer/.runtime/home-desktop.png
            .devcontainer/.runtime/home-mobile.png
            .devcontainer/.runtime/smoke.json
          if-no-files-found: warn
          retention-days: 7
