name: Interior additional test inputs
on:
  push:
    branches: [automation/interior-workbench-20260928]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@v4
        with:
          name: interior-drawing-inputs
          path: docs/FloorPlan/floorplan_final.dxf
          retention-days: 1
