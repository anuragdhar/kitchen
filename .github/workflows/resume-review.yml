name: Resume source review
on:
  push:
    branches: [chore/resume-review-20260928]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 640155d1ce0c70be5e9ecb90c9c6d9456b456f81
          persist-credentials: false
      - name: Archive tracked text source, no credentials or dependencies
        run: |
          python - <<'PY'
          import pathlib, subprocess, zipfile
          extensions={'.js','.jsx','.mjs','.cjs','.ts','.tsx','.py','.json','.md','.yml','.yaml','.html','.css','.bat','.ps1','.txt','.toml','.nvmrc','.gitignore'}
          paths=subprocess.check_output(['git','ls-files','-z']).decode().split('\0')
          with zipfile.ZipFile('/tmp/review-source.zip','w',zipfile.ZIP_DEFLATED) as archive:
              for name in paths:
                  p=pathlib.Path(name)
                  if p.is_file() and (p.suffix in extensions or p.name in {'.nvmrc','.gitignore'}) and 'node_modules' not in p.parts:
                      archive.write(p,name)
              archive.writestr('REVIEW_COMMIT.txt',subprocess.check_output(['git','rev-parse','HEAD']))
              archive.writestr('REVIEW_TREE.txt',subprocess.check_output(['git','ls-tree','-rl','HEAD']))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: review-source
          path: /tmp/review-source.zip
          retention-days: 1
