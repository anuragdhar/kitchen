name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: react-configurator
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: react-configurator/package-lock.json
      - name: Current-layout and tooling tests (no dependencies required)
        run: npm test
      - name: Install locked dependencies
        run: npm ci
      - name: Production build
        run: npm run build
      - name: Install Chromium for behavior and export regressions
        run: npx playwright install --with-deps chromium
      - name: Browser correctness checks
        run: npm run test:browser
      - name: Project persistence browser checks
        run: npm run test:persistence
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correctness-verification
          path: react-configurator/test-results/correctness/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: persistence-verification
          path: react-configurator/test-results/persistence/
          if-no-files-found: ignore
          retention-days: 7

  windows-launcher:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Windows launcher behavior (no dependencies required)
        run: node --test scripts/windows/launchers.test.mjs
