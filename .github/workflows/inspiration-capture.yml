name: Capture inspiration media
on:
  workflow_dispatch:
  push:
    branches: [feat/inspiration-photo-galleries]
    paths:
      - scripts/capture_inspiration.py
      - .github/workflows/inspiration-capture.yml
permissions:
  contents: write
concurrency:
  group: inspiration-capture-${{ github.ref }}
  cancel-in-progress: false
jobs:
  capture:
    if: github.ref == 'refs/heads/feat/inspiration-photo-galleries'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image and video tools
        run: |
          python -m pip install 'Pillow==11.3.0'
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Capture original media (unavailable pins are recorded, never replaced)
        run: python scripts/capture_inspiration.py
      - name: Commit captured media and provenance to this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add inspiration/library.json inspiration/capture-report.json react-configurator/public/inspiration-media
          if ! git diff --cached --quiet; then
            git commit -m 'chore(inspiration): archive accessible pin media and capture report'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inspiration-capture
          path: |
            inspiration/library.json
            inspiration/capture-report.json
            react-configurator/public/inspiration-media
          retention-days: 7
