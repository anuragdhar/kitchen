name: Room parity validation
on:
  push:
    branches: [fix/blender-room-parity-cleanup]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: react-configurator/package-lock.json
      - name: Archive source for isolated review
        run: git archive --format=zip --output=/tmp/room-parity-source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: room-parity-source
          path: /tmp/room-parity-source.zip
          retention-days: 3
      - name: Install locked dependencies
        working-directory: react-configurator
        run: npm ci
      - name: Run baseline tests and build
        working-directory: react-configurator
        run: npm run check
