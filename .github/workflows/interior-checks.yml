name: Interior feature checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: interior-${{ github.ref }}
  cancel-in-progress: true
jobs:
  interior:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: react-configurator
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: react-configurator/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node scripts/interior-browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: interior-verification
          path: react-configurator/test-results/interior/
          retention-days: 7
