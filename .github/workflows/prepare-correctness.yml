name: Prepare and verify correctness changes
on:
  push:
    branches: [chore/prepare-correctness-20260928]
    paths: ['.maintenance/**', '.github/workflows/prepare-correctness.yml']
permissions:
  contents: write
jobs:
  prepare:
    if: github.repository == 'anuragdhar/kitchen' && github.ref == 'refs/heads/chore/prepare-correctness-20260928'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/prepare-correctness-20260928
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Apply hash-guarded edits without changing configuration
        run: |
          python .maintenance/apply-correctness.py
          python .maintenance/adjust-browser.py
      - name: Tests before installation
        working-directory: react-configurator
        run: npm test
      - name: Reconcile missing lock entries, preserving existing locked versions
        working-directory: react-configurator
        run: |
          cp package-lock.json /tmp/kitchen-lock-before.json
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          node <<'JS'
          const fs = require('node:fs');
          const before = JSON.parse(fs.readFileSync('/tmp/kitchen-lock-before.json'));
          const after = JSON.parse(fs.readFileSync('package-lock.json'));
          for (const [name, pkg] of Object.entries(before.packages)) {
            if (pkg.version && after.packages[name]?.version !== pkg.version) {
              throw new Error(`Unexpected version change: ${name} ${pkg.version} -> ${after.packages[name]?.version}`);
            }
          }
          console.log('Existing locked versions preserved. New lock entries:', Object.keys(after.packages).filter(name => !before.packages[name]));
          JS
      - name: Clean install and production checks
        working-directory: react-configurator
        run: |
          npm ci --no-audit --no-fund
          npm run check
      - name: Install browser
        working-directory: react-configurator
        run: npx playwright install --with-deps chromium
      - name: Real browser validation and export regression
        working-directory: react-configurator
        run: npm run test:browser
      - name: Verify protected defaults and commit only intended paths
        run: |
          git diff --exit-code -- react-configurator/src/config react-configurator/src/HomeApp.jsx freecad blender Interior
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add react-configurator/src/App.jsx react-configurator/package.json react-configurator/package-lock.json docs/CURRENT_STATE.md docs/ARCHITECTURE.md docs/TESTING.md react-configurator/scripts/browser-helpers.cjs react-configurator/scripts/correctness-browser.cjs
          git diff --cached --stat
          git commit -m "fix: integrate validated geometry and consistent plan exports; repair lockfile"
          git push origin HEAD:refs/heads/chore/prepare-correctness-20260928
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: correctness-verification
          path: |
            react-configurator/test-results/correctness/
            react-configurator/src/App.jsx
            react-configurator/package-lock.json
          retention-days: 7
