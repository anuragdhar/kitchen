name: Parallel room contracts
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s blender -p test_parallel_profiles.py -v
      - run: python -m unittest discover -s scripts/tests -p test_parallel_rooms.py -v
      - run: node --test react-configurator/tests/archviz.test.mjs react-configurator/tests/parallel-profiles.test.mjs
      - run: python -m py_compile blender/archviz_profiles.py blender/archviz_room_details.py blender/render_archviz.py scripts/render_archviz_rooms.py scripts/parallel_rooms.py
      - name: Check room-specialist ownership
        if: github.event_name == 'pull_request'
        env:
          EVENT_FILE: ${{ github.event_path }}
        shell: bash
        run: python scripts/parallel_rooms.py check-event --event "$EVENT_FILE"
