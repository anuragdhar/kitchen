<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 860" font-family="Segoe UI, Arial, sans-serif" font-size="14">
  <rect width="1200" height="860" fill="#ffffff"/>
  <text x="30" y="36" font-size="22" font-weight="700" fill="#172033">West cabinet (behind the Drawing Room north wall): iron support frame for the floor board</text>
  <text x="30" y="60" fill="#475569">Proposal for the fabricator and engineer to confirm. Sizes in mm, from the 3D model and the plan, not measured on site. Design load: one person (100 kg) plus stored goods.</text>

  <!-- ============ PLAN ============ -->
  <text x="30" y="96" font-size="17" font-weight="700" fill="#172033">1. Plan (looking down)</text>
  <text x="30" y="116" fill="#475569">You stand in the Drawing Room facing the wall: north is ahead, west is on your left.</text>

  <!-- west outer wall -->
  <rect x="90" y="130" width="50" height="420" fill="#cbd5e1" stroke="#475569"/>
  <text x="115" y="345" text-anchor="middle" transform="rotate(-90 115 345)" fill="#172033" font-weight="700">WEST WALL (solid: fasteners go here)</text>
  <!-- back (north) concrete -->
  <rect x="140" y="130" width="420" height="50" fill="#e2e8f0" stroke="#475569"/>
  <text x="320" y="148" text-anchor="middle" fill="#172033" font-weight="700">NORTH end: concrete floor</text>
  <!-- south: drawing room wall with door opening -->
  <rect x="140" y="470" width="60" height="80" fill="#cbd5e1" stroke="#475569"/>
  <rect x="440" y="470" width="320" height="80" fill="#cbd5e1" stroke="#475569"/>
  <rect x="200" y="470" width="240" height="80" fill="#fef3c7" stroke="#b45309" stroke-dasharray="6 4"/>
  <text x="320" y="505" text-anchor="middle" fill="#92400e" font-weight="700">door opening cut by the mason</text>
  <text x="320" y="525" text-anchor="middle" fill="#92400e">500 wide (hidden door)</text>
  <text x="622" y="505" text-anchor="middle" fill="#172033" font-weight="700">Drawing Room north wall</text>
  <text x="622" y="525" text-anchor="middle" fill="#172033">(about 221 thick)</text>
  <text x="350" y="585" text-anchor="middle" fill="#172033" font-weight="700">SOUTH end: Drawing Room concrete floor</text>
  <!-- void -->
  <rect x="140" y="180" width="330" height="290" fill="#f8fafc" stroke="#94a3b8" stroke-dasharray="4 4"/>
  <!-- east side: no wall -->
  <line x1="470" y1="180" x2="470" y2="470" stroke="#dc2626" stroke-width="2" stroke-dasharray="10 6"/>
  <text x="490" y="250" fill="#dc2626" font-weight="700">EAST side: no wall here</text>
  <text x="490" y="270" fill="#dc2626">(the partition is not built yet),</text>
  <text x="490" y="290" fill="#dc2626">so nothing to fasten into sideways.</text>

  <!-- A: west ledger angle -->
  <rect x="140" y="150" width="16" height="350" fill="#1d4ed8"/>
  <!-- B: east box beam -->
  <rect x="446" y="150" width="20" height="350" fill="#b91c1c"/>
  <!-- C: end members -->
  <rect x="156" y="160" width="290" height="12" fill="#0f766e"/>
  <rect x="156" y="478" width="290" height="12" fill="#0f766e"/>
  <!-- D: cross members -->
  <g fill="#7c3aed">
    <rect x="156" y="238" width="290" height="9"/>
    <rect x="156" y="318" width="290" height="9"/>
    <rect x="156" y="398" width="290" height="9"/>
  </g>
  <!-- base plates for B -->
  <rect x="436" y="140" width="40" height="34" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <rect x="436" y="476" width="40" height="34" fill="none" stroke="#b91c1c" stroke-width="2"/>
  <g fill="#111827">
    <circle cx="444" cy="148" r="3"/><circle cx="468" cy="148" r="3"/><circle cx="444" cy="502" r="3"/><circle cx="468" cy="502" r="3"/>
    <circle cx="148" cy="200" r="3"/><circle cx="148" cy="280" r="3"/><circle cx="148" cy="360" r="3"/><circle cx="148" cy="440" r="3"/>
  </g>
  <!-- labels -->
  <g font-weight="700">
    <text x="170" y="215" fill="#1d4ed8">A</text>
    <text x="424" y="215" fill="#b91c1c">B</text>
    <text x="295" y="196" fill="#0f766e">C</text>
    <text x="295" y="460" fill="#0f766e">C</text>
    <text x="295" y="312" fill="#7c3aed">D</text>
  </g>
  <!-- dimensions -->
  <g stroke="#334155" fill="#334155">
    <line x1="140" y1="620" x2="466" y2="620"/><line x1="140" y1="612" x2="140" y2="628"/><line x1="466" y1="612" x2="466" y2="628"/>
    <line x1="60" y1="150" x2="60" y2="500"/><line x1="52" y1="150" x2="68" y2="150"/><line x1="52" y1="500" x2="68" y2="500"/>
  </g>
  <text x="303" y="640" text-anchor="middle" fill="#334155">about 650 wide (west wall to the future partition)</text>
  <text x="48" y="330" text-anchor="middle" transform="rotate(-90 48 330)" fill="#334155">about 1,100 front to back: confirm on site</text>
  <!-- compass -->
  <g transform="translate(700 170)" fill="#172033" font-weight="700" text-anchor="middle">
    <line x1="0" y1="40" x2="0" y2="-30" stroke="#172033" stroke-width="2"/><path d="M0 -40 l-7 14 h14 z"/>
    <text x="0" y="-48">N</text><text x="0" y="62">S</text><text x="-34" y="10">W</text><text x="34" y="10">E</text>
  </g>

  <!-- ============ SECTION ============ -->
  <text x="800" y="96" font-size="17" font-weight="700" fill="#172033">2. Section, looking north</text>
  <rect x="800" y="130" width="45" height="250" fill="#cbd5e1" stroke="#475569"/>
  <text x="822" y="262" text-anchor="middle" transform="rotate(-90 822 262)" fill="#172033" font-weight="700">west wall</text>
  <!-- board -->
  <rect x="845" y="262" width="300" height="12" fill="#d6a66a" stroke="#92400e"/>
  <text x="995" y="254" text-anchor="middle" fill="#92400e" font-weight="700">board: 19 mm waterproof ply</text>
  <!-- angle A (L shape) -->
  <path d="M845 274 h42 v6 h-36 v36 h-6 z" fill="#1d4ed8"/>
  <circle cx="848" cy="300" r="3" fill="#111827"/>
  <line x1="800" y1="300" x2="848" y2="300" stroke="#111827" stroke-width="2"/>
  <text x="858" y="338" fill="#1d4ed8" font-weight="700">A angle, bolted</text>
  <text x="858" y="356" fill="#1d4ed8">into the wall</text>
  <!-- cross member -->
  <rect x="887" y="274" width="220" height="9" fill="#7c3aed"/>
  <text x="997" y="300" text-anchor="middle" fill="#7c3aed" font-weight="700">D cross member</text>
  <!-- box beam B -->
  <rect x="1107" y="274" width="34" height="34" fill="none" stroke="#b91c1c" stroke-width="5"/>
  <text x="1142" y="330" text-anchor="end" fill="#b91c1c" font-weight="700">B box beam</text>
  <text x="1142" y="348" text-anchor="end" fill="#b91c1c">no wall beside it</text>
  <line x1="1150" y1="130" x2="1150" y2="380" stroke="#dc2626" stroke-width="2" stroke-dasharray="10 6"/>

  <!-- ============ SIDE VIEW of B ============ -->
  <text x="800" y="420" font-size="17" font-weight="700" fill="#172033">3. Beam B from the side</text>
  <rect x="800" y="490" width="80" height="60" fill="#e2e8f0" stroke="#475569"/>
  <rect x="1070" y="490" width="80" height="60" fill="#e2e8f0" stroke="#475569"/>
  <text x="840" y="575" text-anchor="middle" fill="#172033" font-weight="700">south floor</text>
  <text x="1110" y="575" text-anchor="middle" fill="#172033" font-weight="700">north floor</text>
  <rect x="812" y="466" width="326" height="18" fill="none" stroke="#b91c1c" stroke-width="5"/>
  <rect x="806" y="484" width="60" height="6" fill="#b91c1c"/><rect x="1084" y="484" width="60" height="6" fill="#b91c1c"/>
  <g stroke="#111827" stroke-width="2"><line x1="820" y1="484" x2="820" y2="520"/><line x1="852" y1="484" x2="852" y2="520"/><line x1="1098" y1="484" x2="1098" y2="520"/><line x1="1130" y1="484" x2="1130" y2="520"/></g>
  <text x="975" y="456" text-anchor="middle" fill="#b91c1c" font-weight="700">spans the gap; 100 or more on concrete each end</text>
  <text x="975" y="520" text-anchor="middle" fill="#64748b">gap below</text>
  <text x="975" y="600" text-anchor="middle" fill="#334155">base plate 100 x 100 x 6, two M10 anchor bolts each end</text>

  <!-- ============ PARTS LIST ============ -->
  <rect x="30" y="670" width="1140" height="170" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <g>
    <text x="50" y="698" fill="#1d4ed8" font-weight="700">A  West ledger angle</text><text x="250" y="698" fill="#172033">50 x 50 x 6 angle, full length, bolted into the west wall with M10 anchor fasteners every 300 mm.</text>
    <text x="50" y="722" fill="#b91c1c" font-weight="700">B  East beam</text><text x="250" y="722" fill="#172033">50 x 50 x 3 square hollow section. Needs no side wall: it spans north to south and is bolted down to the concrete floor at both ends.</text>
    <text x="50" y="746" fill="#0f766e" font-weight="700">C  End members</text><text x="250" y="746" fill="#172033">40 x 40 x 5 angle across the north and south ends, sitting on the concrete, welded to A and B to close the frame.</text>
    <text x="50" y="770" fill="#7c3aed" font-weight="700">D  Cross members</text><text x="250" y="770" fill="#172033">40 x 40 x 3 hollow section or angle, welded between A and B, no more than 300 mm apart.</text>
    <text x="50" y="794" fill="#92400e" font-weight="700">Board</text><text x="250" y="794" fill="#172033">19 mm waterproof (BWP) plywood screwed to the frame. One coat of anti-rust primer and two of paint on all steel before the board goes on.</text>
    <text x="50" y="822" fill="#475569">Member sizes are a starting point for a span of about 1.1 m and 100 kg walking on it; the fabricator or engineer must confirm them, the anchors and the real span.</text>
  </g>
</svg>
