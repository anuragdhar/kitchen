<text x="60" y="834" font-size="15" font-weight="700" fill="#991b1b">This is a floor over a drop, so a structural engineer must size the steel and the anchors and sign it off.</text>
<text x="60" y="858" font-size="15" fill="#991b1b">Until the plate is welded on, the opening needs a barrier, and nothing must be allowed to fall down the shaft onto the floors below.</text>
