<rect x="190" y="195" width="150" height="20" fill="#94a3b8" stroke="#475569"/>
<rect x="340" y="230" width="70" height="16" fill="#8a5b37" stroke="#4d3220"/>
<rect x="340" y="314" width="70" height="16" fill="#8a5b37" stroke="#4d3220"/>
<rect x="340" y="661" width="70" height="16" fill="#8a5b37" stroke="#4d3220"/>
<line x1="352" y1="246" x2="352" y2="314" stroke="#60a5fa" stroke-width="5"/>
