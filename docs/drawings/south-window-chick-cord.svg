<circle cx="314" cy="286" r="17" fill="#d9a85a" stroke="#9a6a24" stroke-width="2"/>
<circle cx="314" cy="286" r="9" fill="none" stroke="#9a6a24"/>
<polyline points="306,286 306,238 340,238 410,238 432,244 432,480" fill="none" stroke="#dc2626" stroke-width="2.5"/>
<circle cx="340" cy="238" r="5" fill="#fff" stroke="#b45309" stroke-width="2.5"/>
<circle cx="410" cy="238" r="5" fill="#fff" stroke="#b45309" stroke-width="2.5"/>
<path d="M424 480 h16 M428 472 v16 M436 472 v16" stroke="#334155" stroke-width="3"/>
<rect x="412" y="330" width="14" height="12" fill="#64748b"/>
<line x1="419" y1="342" x2="419" y2="661" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2 4"/>
<path d="M450 565 h36 v170 h120 v107 h-156 z" fill="#f1e4cf" stroke="#b08a5a"/>
<text x="50" y="120" fill="#172033" font-weight="700" font-size="19" text-anchor="start">1. Screen rolled UP</text>
<text x="50" y="142" fill="#475569" font-weight="400" font-size="15" text-anchor="start">The roll parks in front of the fixed top band. Shutters open under it.</text>
<line x1="296" y1="286" x2="140" y2="300" stroke="#9a6a24" stroke-width="1"/>
<text x="50" y="296" fill="#7c4a12" font-weight="700" font-size="15" text-anchor="start">rolled-up screen,</text>
<text x="50" y="316" fill="#7c4a12" font-weight="400" font-size="15" text-anchor="start">in front of the fixed</text>
<text x="50" y="336" fill="#7c4a12" font-weight="400" font-size="15" text-anchor="start">top band (about 1 ft)</text>
<line x1="280" y1="560" x2="170" y2="620" stroke="#8a5b37" stroke-width="1"/>
<text x="50" y="640" fill="#6b3f1d" font-weight="700" font-size="15" text-anchor="start">shutter opens freely</text>
<text x="50" y="660" fill="#6b3f1d" font-weight="400" font-size="15" text-anchor="start">below the roll</text>
<line x1="375" y1="238" x2="490" y2="215" stroke="#b45309" stroke-width="1"/>
<text x="460" y="196" fill="#92400e" font-weight="700" font-size="15" text-anchor="start">lined hole in the frame head</text>
<text x="460" y="216" fill="#92400e" font-weight="400" font-size="15" text-anchor="start">for the cord</text>
<line x1="440" y1="480" x2="490" y2="452" stroke="#dc2626" stroke-width="1"/>
<text x="496" y="446" fill="#b91c1c" font-weight="700" font-size="15" text-anchor="start">pull and tie</text>
<text x="496" y="466" fill="#b91c1c" font-weight="400" font-size="15" text-anchor="start">from inside</text>
<line x1="426" y1="380" x2="490" y2="360" stroke="#475569" stroke-width="1"/>
<text x="496" y="364" fill="#475569" font-weight="400" font-size="15" text-anchor="start">roller net</text>
<text x="496" y="384" fill="#475569" font-weight="400" font-size="15" text-anchor="start">(opening part only)</text>
<text x="190" y="186" fill="#334155" font-weight="700" font-size="15" text-anchor="start">cover</text>
<line x1="352" y1="275" x2="490" y2="290" stroke="#2563eb" stroke-width="1"/>
<text x="496" y="294" fill="#1d4ed8" font-weight="400" font-size="15" text-anchor="start">fixed glass, top 1 ft</text>
<rect x="990" y="150" width="70" height="80" fill="#cbd5e1" stroke="#475569"/>
<rect x="990" y="677" width="70" height="165" fill="#cbd5e1" stroke="#475569"/>
<rect x="990" y="842" width="300" height="16" fill="#e2e8f0" stroke="#475569"/>
<rect x="840" y="195" width="150" height="20" fill="#94a3b8" stroke="#475569"/>
<rect x="990" y="230" width="70" height="16" fill="#8a5b37" stroke="#4d3220"/>
<rect x="990" y="314" width="70" height="16" fill="#8a5b37" stroke="#4d3220"/>
<rect x="990" y="661" width="70" height="16" fill="#8a5b37" stroke="#4d3220"/>
<line x1="1002" y1="246" x2="1002" y2="314" stroke="#60a5fa" stroke-width="5"/>
<circle cx="964" cy="236" r="4" fill="#334155"/>
<line x1="1002" y1="330" x2="1002" y2="661" stroke="#60a5fa" stroke-width="5"/>
<rect x="960" y="236" width="8" height="417" fill="url(#bamboo)" stroke="#9a6a24"/>
<circle cx="964" cy="659" r="11" fill="#d9a85a" stroke="#9a6a24" stroke-width="2"/>
<path d="M990 671 h-14" stroke="#334155" stroke-width="3"/>
<line x1="750" y1="230" x2="954" y2="300" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="750" y1="330" x2="954" y2="400" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/>
<line x1="750" y1="430" x2="954" y2="500" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/>
<polyline points="956,659 956,238 990,238 1060,238 1082,244 1082,480" fill="none" stroke="#dc2626" stroke-width="2.5"/>
<circle cx="990" cy="238" r="5" fill="#fff" stroke="#b45309" stroke-width="2.5"/>
<circle cx="1060" cy="238" r="5" fill="#fff" stroke="#b45309" stroke-width="2.5"/>
<path d="M1074 480 h16 M1078 472 v16 M1086 472 v16" stroke="#334155" stroke-width="3"/>
<rect x="1062" y="330" width="14" height="12" fill="#64748b"/>
<line x1="1069" y1="342" x2="1069" y2="661" stroke="#64748b" stroke-width="1.5" stroke-dasharray="2 4"/>
<path d="M1100 565 h36 v170 h120 v107 h-156 z" fill="#f1e4cf" stroke="#b08a5a"/>
<text x="700" y="120" fill="#172033" font-weight="700" font-size="19" text-anchor="start">2. Screen rolled DOWN (hot afternoons)</text>
<text x="700" y="142" fill="#475569" font-weight="400" font-size="15" text-anchor="start">Shut the shutters first, then lower it. Sun and heat stop outside.</text>
<text x="700" y="300" fill="#b45309" font-weight="700" font-size="15" text-anchor="start">summer sun</text>
<text x="700" y="560" fill="#b45309" font-weight="400" font-size="15" text-anchor="start">stopped before</text>
<text x="700" y="580" fill="#b45309" font-weight="400" font-size="15" text-anchor="start">the glass</text>
<line x1="958" y1="440" x2="890" y2="620" stroke="#9a6a24" stroke-width="1"/>
<text x="740" y="644" fill="#7c4a12" font-weight="700" font-size="15" text-anchor="start">screen 85 mm off the wall:</text>
<text x="740" y="664" fill="#7c4a12" font-weight="400" font-size="15" text-anchor="start">close, so little sun gets round it</text>
<line x1="976" y1="671" x2="930" y2="760" stroke="#334155" stroke-width="1"/>
<text x="775" y="782" fill="#334155" font-weight="700" font-size="15" text-anchor="start">bottom rail hooked at the sill</text>
<text x="775" y="802" fill="#334155" font-weight="400" font-size="15" text-anchor="start">so wind cannot swing it</text>
<line x1="1002" y1="500" x2="1140" y2="520" stroke="#2563eb" stroke-width="1"/>
<text x="1146" y="524" fill="#1d4ed8" font-weight="700" font-size="15" text-anchor="start">shutters shut</text>
<text x="1146" y="544" fill="#1d4ed8" font-weight="400" font-size="15" text-anchor="start">(AC is on anyway)</text>
<rect x="40" y="880" width="1320" height="84" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
<text x="60" y="908" font-weight="700" fill="#172033">What the fixed top band changes</text>
<text x="60" y="930" fill="#334155">The screen can hang close to the wall instead of 450 mm out: no long brackets, the cover does not need to project far, less wind sway, better shade.</text>
<text x="60" y="952" fill="#334155">The one rule: shutters are shut while the screen is down. Roll it up first whenever you want to open them. The cord works from inside either way.</text>
</svg>