<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" font-family="Segoe UI, Arial, sans-serif" font-size="15">
<defs><pattern id="bamboo" width="6" height="8" patternUnits="userSpaceOnUse"><rect width="6" height="8" fill="#d9a85a"/><line x1="0" y1="7.5" x2="6" y2="7.5" stroke="#9a6a24" stroke-width="1.2"/></pattern>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#f59e0b"/></marker></defs>
<rect width="1400" height="980" fill="#ffffff"/>
<text x="40" y="46" font-size="25" font-weight="700" fill="#172033">Outside sun screen on the south-west window, using the fixed top band</text>
<text x="40" y="72" fill="#475569">Cut through the wall, seen from the side: outside on the left, the Drawing Room on the right. Sizes are estimates until measured.</text>
<rect x="340" y="150" width="70" height="80" fill="#cbd5e1" stroke="#475569"/>
<rect x="340" y="677" width="70" height="165" fill="#cbd5e1" stroke="#475569"/>
